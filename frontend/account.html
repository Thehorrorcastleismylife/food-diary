<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование профиля</title>
    <link rel="stylesheet" href="css/account.css"
</head>
<body>
    <div class="card">
        <h1 class="header">Ваш аккаунт</h1>
        
        <div class="form-group">
            <label for="age">Возраст</label>
            <input type="number" id="age" placeholder="Введите возраст" min="1" max="120">
        </div>

        <div class="form-group">
            <label for="weight">Вес (кг)</label>
            <input type="number" id="weight" placeholder="Введите вес" min="1" step="0.1">
        </div>

        <div class="form-group">
            <label for="height">Рост (см)</label>
            <input type="number" id="height" placeholder="Введите рост" min="1">
        </div>

        <div class="form-group">
            <label for="activity">Активность</label>
            <input type="number" id="activity" placeholder="Уровень активности" min="0" step="0.1">
        </div>

        <div class="form-group">
            <label for="desiredWeight">Желаемый вес (кг)</label>
            <input type="number" id="desiredWeight" placeholder="Введите желаемый вес" min="1" step="0.1">
        </div>

        <button class="btn-changed-info" onclick="changeData()">Сохранить изменения</button>
    </div>
    <script type="module" src="JS/mainPage/displayInfoAboutUser.js"></script>
    <script src="JS/account/changedInfo.js"></script>
</body>
</html>
