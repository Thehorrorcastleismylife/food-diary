<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер питания PRO</title>
  <link rel="stylesheet" href="/css/mainPage.css">
</head>
<body>

  <header>
    <button class="icon-btn">📅</button>
    <div class="header-center">
      <button class="nav-arrow" id="btn-prev">❮</button>
      <div id="date-title">Сегодня: 19 апреля</div>
      <button class="nav-arrow" id="btn-next">❯</button>
    </div>
    <button class="icon-btn" onclick="window.location.replace('./account.html');">👤</button>
  </header>

  <div class="app-container">
    
    <div class="panel left-panel" id="stats-panel">
      <div class="rings-wrapper">
        <svg viewBox="0 0 360 360">
          <circle cx="180" cy="180" r="160" class="ring-bg"/>
          <circle cx="180" cy="180" r="130" class="ring-bg"/>
          <circle cx="180" cy="180" r="100" class="ring-bg"/>
          
          <circle cx="180" cy="180" r="160" class="ring-progress ring-carbs" id="circle-carbs"/>
          <circle cx="180" cy="180" r="130" class="ring-progress ring-protein" id="circle-protein"/>
          <circle cx="180" cy="180" r="100" class="ring-progress ring-fats" id="circle-fats"/>
        </svg>
        <div class="ring-labels">
          <span class="total-cal-num" id="main-cal-display">0</span>
          <span class="total-cal-text">ккал съедено</span>
        </div>
      </div>

      <div class="macro-stats-row">
        <div class="macro-item">
          <span style="color:var(--color-carbs)">УГЛЕВОДЫ</span>
          <div class="macro-val" id="stat-carbs">0г / 302г</div>
        </div>
        <div class="macro-item">
          <span style="color:var(--color-protein)">БЕЛКИ</span>
          <div class="macro-val" id="stat-protein">0г / 151г</div>
        </div>
        <div class="macro-item">
          <span style="color:var(--color-fats)">ЖИРЫ</span>
          <div class="macro-val" id="stat-fats">0г / 67г</div>
        </div>
      </div>
      
      <div style="margin-top: 25px; font-weight: 600; font-size: 18px; color: var(--text-gray);" id="text-left">
        Осталось: 2413 ккал
      </div>
    </div>

    <div class="panel right-panel">
      <h2 class="list-header">Дневник еды</h2>
      <div class="food-list" id="food-items-container">
        </div>
      <button class="add-btn" id="btn-add">Записать прием пищи</button>
    </div>

  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <h2 style="font-size: 28px; margin-bottom: 10px;">Новое блюдо</h2>
      <p style="color: var(--text-gray); margin-bottom: 20px;">Введите данные о еде</p>
      
      <div style="margin-bottom: 20px;">
        <label style="display:block; margin-bottom:8px; font-weight:600;">Название</label>
        <input type="text" id="input-name" placeholder="Что вы съели?">
      </div>
      
      <div class="modal-grid">
        <div>
          <label style="display:block; margin-bottom:8px; font-weight:600; color: var(--color-carbs);">Углеводы (г)</label>
          <input type="number" id="input-carbs" placeholder="0">
        </div>
        <div>
          <label style="display:block; margin-bottom:8px; font-weight:600; color: var(--color-protein);">Белки (г)</label>
          <input type="number" id="input-protein" placeholder="0">
        </div>
        <div style="grid-column: span 2;">
          <label style="display:block; margin-bottom:8px; font-weight:600; color: var(--color-fats);">Жиры (г)</label>
          <input type="number" id="input-fats" placeholder="0">
        </div>
      </div>

      <div style="display:flex; gap:15px; margin-top:30px;">
        <button id="btn-cancel" style="flex:1; padding:18px; border-radius:15px; border:none; cursor:pointer; font-weight:600; background:#F1F5F9;">Отмена</button>
        <button id="btn-save" style="flex:2; padding:18px; border-radius:15px; border:none; cursor:pointer; font-weight:600; background:var(--color-green); color:white;">Добавить в дневник</button>
      </div>
    </div>
  </div>
  <script src="JS/mainPage/displayInfoAboutUser.js"></script>
</body>
</html>
